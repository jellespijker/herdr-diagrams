# Bundled renderer registry for herdr-diagrams (docs/spec.md §6, ADR-0003).
#
# Override or add entries in the plugin config dir:
#   $(herdr plugin config-dir herdr-diagrams)/renderers.toml
# A user entry replaces the bundled entry with the same key.
#
# argv placeholders: {in} input file, {out} output file, {outdir} scratch dir,
# {root} plugin root, {cwd} the Item's origin cwd. No shell is involved.
# themes.<name> lists extra args appended for the configured theme (dark | light).

[mermaid]
detect = ["mermaid", "mmd"]
argv = ["{root}/node_modules/.bin/mmdc", "-q", "-i", "{in}", "-o", "{out}",
        "-s", "2", "-w", "1200", "-p", "{root}/puppeteer.json"]
in_ext = "mmd"
out = "png"
themes.dark = ["-c", "{root}/mermaid-dark.json", "-b", "transparent"]
themes.light = ["-c", "{root}/mermaid-light.json", "-b", "white"]

[plantuml]
detect = ["plantuml", "puml", "uml"]
argv = ["plantuml", "-tpng", "-pipe"]
stdio = true
out = "png"
env = { PLANTUML_SECURITY_PROFILE = "SANDBOX", PLANTUML_LIMIT_SIZE = "8192" }
themes.dark = ["--dark-mode"]
timeout = 60

[d2]
detect = ["d2"]
argv = ["d2", "--pad", "24", "--scale", "2", "{in}", "{out}"]
in_ext = "d2"
out = "png"
themes.dark = ["--theme", "200"]
themes.light = ["--theme", "0"]
timeout = 60

[graphviz]
detect = ["graphviz", "dot", "gv"]
argv = ["dot", "-Tpng", "-Gdpi=144", "-Gfontname=Helvetica", "-Nfontname=Helvetica",
        "-Efontname=Helvetica", "-o", "{out}", "{in}"]
in_ext = "dot"
out = "png"
themes.dark = ["-Gbgcolor=transparent", "-Gfontcolor=#e6e6e6", "-Ncolor=#e6e6e6",
               "-Nfontcolor=#e6e6e6", "-Ecolor=#b0b0b0", "-Efontcolor=#e6e6e6"]

[structurizr]
detect = ["structurizr", "dsl", "c4"]
argv = ["structurizr-cli", "export", "-w", "{in}", "-f", "plantuml/c4plantuml", "-o", "{outdir}"]
in_ext = "dsl"
fanout = "*.puml"
then = "plantuml"
timeout = 90
