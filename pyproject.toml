# Development tooling only. At runtime the plugin needs nothing but Python 3.11+
# (ADR-0006); `bin/herdr-diagram` puts src/ on sys.path itself.

[project]
name = "herdr-diagrams"
version = "0.1.2"
description = "Herdr plugin: diagrams from coding agents, rendered as images in a split pane."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "import-linter>=2", "jsonschema>=4"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM105", "SIM108"]

[tool.importlinter]
root_package = "herdr_diagrams"

[[tool.importlinter.contracts]]
name = "Harness adapters only write Items (ADR-0001, ADR-0005)"
type = "forbidden"
source_modules = ["herdr_diagrams.harness"]
forbidden_modules = ["herdr_diagrams.render", "herdr_diagrams.display", "herdr_diagrams.viewer",
                     "herdr_diagrams.viewers", "herdr_diagrams.herdr", "herdr_diagrams.cli",
                     "herdr_diagrams.skill"]

[[tool.importlinter.contracts]]
name = "Rendering knows nothing about panes or displays (ADR-0003)"
type = "forbidden"
source_modules = ["herdr_diagrams.render"]
forbidden_modules = ["herdr_diagrams.display", "herdr_diagrams.viewer", "herdr_diagrams.viewers",
                     "herdr_diagrams.harness", "herdr_diagrams.herdr", "herdr_diagrams.cli"]

[[tool.importlinter.contracts]]
name = "Display knows only PNG files and cells (ADR-0004)"
type = "forbidden"
source_modules = ["herdr_diagrams.display"]
forbidden_modules = ["herdr_diagrams.render", "herdr_diagrams.item", "herdr_diagrams.harness",
                     "herdr_diagrams.viewer", "herdr_diagrams.detect"]
