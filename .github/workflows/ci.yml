name: ci

on:
  push:
    branches: [main, release]
  pull_request:
    branches: [main, release]
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Version and changelog are consistent
        run: python3 scripts/release_check.py
      - name: Lint
        run: |
          uv sync
          uv run ruff check src tests scripts
          PYTHONPATH=src uv run lint-imports

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: astral-sh/setup-uv@v7

      - name: Renderers (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz librsvg2-bin
          # Chromium (Mermaid) needs unprivileged user namespaces for its sandbox
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          curl -fsSL https://d2lang.com/install.sh | sh -s --

      - name: Renderers (macOS)
        if: runner.os == 'macOS'
        run: brew install graphviz d2 plantuml librsvg

      - name: Mermaid
        run: sh scripts/build.sh

      - name: Test
        run: |
          uv sync
          uv run pytest -q -rs
