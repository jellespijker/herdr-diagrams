name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: astral-sh/setup-uv@v6

      - name: Renderers (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz librsvg2-bin
          # Chromium (Mermaid) needs unprivileged user namespaces for its sandbox
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          curl -fsSL https://d2lang.com/install.sh | sh -s --

      - name: Renderers (macOS)
        if: runner.os == 'macOS'
        run: brew install graphviz d2 plantuml librsvg

      - name: Mermaid
        run: sh scripts/build.sh

      - name: Lint
        run: |
          uv sync
          uv run ruff check src tests
          PYTHONPATH=src uv run lint-imports

      - name: Test
        run: uv run pytest -q -rs
