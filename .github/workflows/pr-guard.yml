name: pr-guard

# The release branch only moves by the release workflow or by a pull request from main.
on:
  pull_request:
    branches: [release]

permissions:
  contents: read

jobs:
  source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Pull requests into release must come from main
        if: github.head_ref != 'main' || github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::Open the pull request against main. release is updated by the release workflow."
          exit 1
      - run: echo "source branch ok"
